<body>
<main id="app"></main>
<div id="toast" role="status"><span id="toast-msg"></span><button type="button" id="toast-undo">Deshacer</button></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
var firebaseConfig = {
  apiKey: "AIzaSyBJvSbK3lDyxy8yfmMPE_d5l8IpWkMoMfs",
  authDomain: "faltantes-en-mesita.firebaseapp.com",
  projectId: "faltantes-en-mesita",
  appId: "1:678572128455:web:7f148825e41fe082cf66e2"
};

(function () {
  var ROLES = { pending: "Pendiente", blocked: "Bloqueado", reader: "Lector", editor: "Editor", admin: "Admin" };
  var DEFAULT_CATALOG = [
    { id: "set", name: "Equipo de mate completo" }, { id: "mate", name: "Mate" },
    { id: "termo", name: "Termo" }, { id: "bombilla", name: "Bombilla" }
  ];
  var DEFAULT_MESITAS = [{ id: "civil", name: "Mesita de Civil", color: 0 }, { id: "electro", name: "Mesita de Electromecánica y Mecánica", color: 1 }];
  var app = document.getElementById("app");
  var auth, db, authUser = null, me = null;
  var loans = [], users = [], catalog = DEFAULT_CATALOG.slice(), loansLoaded = false;
  var mesitas = DEFAULT_MESITAS.slice(), mfilter = "todas", mesitaSel = "", formPhoto = null;
  try { mesitaSel = localStorage.getItem("lastMesita") || ""; } catch (e) {}
  var subMe = null, subData = [], activeRole = null, catQueue = Promise.resolve();
  var view = "ahora", editMode = false, filter = "todos", selected = [], drafts = {}, pendingDel = null, lastReturned = null, toastTimer = null, msg = "";

  function mk(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function clean(v) { return (v || "").trim().replace(/\s+/g, " "); }
  function isMember() { return me && (me.role === "reader" || me.role === "editor" || me.role === "admin"); }
  function canWrite() { return me && (me.role === "editor" || me.role === "admin"); }
  function isAdmin() { return me && me.role === "admin"; }
  function firstName() { var n = (authUser && (authUser.displayName || authUser.email)) || ""; return n.split(" ")[0]; }
  function errText(e, fb) { return e && e.code === "permission-denied" ? "No tenés permiso para hacer esto." : fb; }
  function p2(x) { return ("0" + x).slice(-2); }
  function fmt(t) { var d = new Date(t); return p2(d.getDate()) + "/" + p2(d.getMonth() + 1) + "/" + d.getFullYear() + " " + p2(d.getHours()) + ":" + p2(d.getMinutes()); }
  function ago(t) {
    var a = new Date(t), n = new Date(); a.setHours(0, 0, 0, 0); n.setHours(0, 0, 0, 0);
    var d = Math.round((n - a) / 86400000);
    return d <= 0 ? "hoy" : (d === 1 ? "ayer" : "hace " + d + " días");
  }

  function showToast(text, canUndo) {
    document.getElementById("toast-msg").textContent = text;
    document.getElementById("toast-undo").style.display = canUndo ? "" : "none";
    var t = document.getElementById("toast"); t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove("show"); lastReturned = null; }, 6000);
  }
  document.getElementById("toast-undo").addEventListener("click", function () {
    if (!lastReturned) return;
    var id = lastReturned; lastReturned = null;
    db.collection("loans").doc(id).update({ returnedAt: null, returnedBy: null }).catch(function () { showToast("No se pudo deshacer.", false); });
    document.getElementById("toast").classList.remove("show");
  });

  function draftInput(key, value, placeholder, max) {
    var inp = mk("input"); inp.type = "text"; inp.maxLength = max; inp.autocomplete = "off"; inp.dataset.key = key;
    if (placeholder) inp.placeholder = placeholder;
    inp.value = drafts[key] != null ? drafts[key] : value;
    inp.addEventListener("input", function () { drafts[key] = inp.value; });
    return inp;
  }

  /* ---------- datos ---------- */
  function stopData() { subData.forEach(function (u) { try { u(); } catch (e) {} }); subData = []; loans = []; users = []; catalog = DEFAULT_CATALOG.slice(); mesitas = DEFAULT_MESITAS.slice(); loansLoaded = false; }
  function fail() { msg = "Se perdió la conexión o falta permiso para leer los datos."; render(); }
  function startData(role) {
    if (role === "reader" || role === "editor" || role === "admin") {
      subData.push(db.collection("config").doc("catalog").onSnapshot(function (d) {
        var v = d.exists ? d.data() : null;
        catalog = v && Array.isArray(v.list) && v.list.length ? v.list.map(function (x) { return { id: String(x.id), name: String(x.name || "") }; }) : DEFAULT_CATALOG.slice();
        render();
      }, function () {}));
      subData.push(db.collection("config").doc("mesitas").onSnapshot(function (d) {
        var v = d.exists ? d.data() : null;
        mesitas = v && Array.isArray(v.list) && v.list.length ? v.list.map(function (x) { return { id: String(x.id), name: String(x.name || ""), color: x.color }; }) : DEFAULT_MESITAS.slice();
        render();
      }, function () {}));
      subData.push(db.collection("loans").orderBy("lentAt", "desc").limit(500).onSnapshot(function (s) {
        loans = s.docs.map(function (d) {
          var v = d.data();
          return { id: d.id, itemName: String(v.itemName || ""), borrower: String(v.borrower || ""), note: String(v.note || ""), mesita: String(v.mesita || ""), lentAt: v.lentAt || 0,
                   lentBy: String(v.lentBy || ""), returnedAt: v.returnedAt || null, returnedBy: String(v.returnedBy || ""),
                   hasPhoto: v.hasPhoto === true, editedAt: v.editedAt || null, editedBy: String(v.editedBy || "") };
        });
        loansLoaded = true; msg = ""; render();
      }, fail));
    }
    if (role === "admin") {
      subData.push(db.collection("users").onSnapshot(function (s) {
        users = s.docs.map(function (d) { var v = d.data(); return { uid: d.id, name: String(v.name || ""), email: String(v.email || ""), role: String(v.role || "pending"), createdAt: v.createdAt || 0 }; });
        render();
      }, function () {}));
    }
  }

  function init() {
    firebase.initializeApp(firebaseConfig);
    auth = firebase.auth(); db = firebase.firestore();
    auth.onAuthStateChanged(function (u) {
      if (subMe) { subMe(); subMe = null; }
      stopData(); activeRole = null; me = null; authUser = u; view = "ahora"; editMode = false;
      if (!u) { render(); return; }
      render();
      var ref = db.collection("users").doc(u.uid);
      ref.get().then(function (snap) {
        if (snap.exists) return;
        return ref.set({ name: u.displayName || "", email: u.email || "", role: "pending", createdAt: Date.now() });
      }).then(function () {
        subMe = ref.onSnapshot(function (snap) {
          me = snap.exists ? snap.data() : { role: "pending" };
          if (me.role !== activeRole) { stopData(); activeRole = me.role; startData(me.role); }
          render();
        }, function () { msg = "No se pudo leer tu perfil. Revisá tu conexión."; render(); });
      }).catch(function () { msg = "No se pudo iniciar. Revisá la configuración de Firebase y las reglas."; render(); });
    });
  }
  function signIn() {
    var p = new firebase.auth.GoogleAuthProvider();
    auth.signInWithPopup(p).catch(function (e) {
      if (e && (e.code === "auth/popup-blocked" || e.code === "auth/operation-not-supported-in-this-environment")) auth.signInWithRedirect(p);
      else if (e && e.code === "auth/unauthorized-domain") { msg = "Este dominio no está autorizado en Firebase (Authentication > Configuración > Dominios autorizados)."; render(); }
      else if (!e || e.code !== "auth/popup-closed-by-user") { msg = "No se pudo iniciar sesión" + (e && e.code ? " (" + e.code + ")" : "") + "."; render(); }
    });
  }

  /* ---------- acciones ---------- */
  function registerLoan() {
    var who = clean(drafts.borrower), note = clean(drafts.note), custom = clean(drafts.custom);
    if (custom && selected.indexOf(custom) < 0) selected.push(custom);
    if (!mesitaSel) { showToast("Elegí en qué mesita se presta.", false); return; }
    if (!who) { showToast("Escribí a quién se lo prestás.", false); return; }
    if (!selected.length) { showToast("Elegí qué cosa(s) prestás.", false); return; }
    var now = Date.now(), batch = db.batch(), names = selected.slice();
    names.forEach(function (name, i) {
      var d = { itemName: name, borrower: who, mesita: mesitaSel, lentAt: now + i, lentBy: firstName(), returnedAt: null };
      if (note) d.note = note;
      if (formPhoto) d.hasPhoto = true;
      var ref = db.collection("loans").doc();
      batch.set(ref, d);
      if (formPhoto) batch.set(db.collection("loanPhotos").doc(ref.id), { data: formPhoto, by: firstName(), at: now });
    });
    batch.commit().then(function () {
      selected = []; formPhoto = null; delete drafts.borrower; delete drafts.note; delete drafts.custom;
      showToast("Registrado: " + names.join(", ") + " → " + who, false); render();
    }).catch(function (e) { showToast(errText(e, "No se pudo registrar. Probá de nuevo."), false); });
  }
  function returnLoan(l, li) {
    li.classList.add("out");
    setTimeout(function () {
      db.collection("loans").doc(l.id).update({ returnedAt: Date.now(), returnedBy: firstName() }).then(function () {
        lastReturned = l.id; showToast("Devuelto: " + l.itemName + " (" + l.borrower + ")", true);
      }).catch(function (e) { li.classList.remove("out"); showToast(errText(e, "No se pudo marcar."), false); });
    }, 250);
  }
  function editCatalog(fn) {
    catQueue = catQueue.then(function () {
      var next = fn(catalog.map(function (c) { return { id: c.id, name: c.name }; }));
      catalog = next;
      return db.collection("config").doc("catalog").set({ list: next });
    }).catch(function (e) { msg = errText(e, "No se pudo guardar el cambio."); render(); });
    return catQueue;
  }
  function mesitaInfo(id) {
    for (var i = 0; i < mesitas.length; i++) if (mesitas[i].id === id) {
      var c = mesitas[i].color;
      return { id: id, name: mesitas[i].name, k: (typeof c === "number" && c >= 0 && c < 8) ? c : (i % 4) };
    }
    return null;
  }
  function mesitaLabel(id) { var m = mesitaInfo(id); return m ? m.name : "Sin indicar"; }
  function editMesitas(fn) {
    catQueue = catQueue.then(function () {
      var next = fn(mesitas.map(function (m) { return { id: m.id, name: m.name, color: m.color }; }));
      next = next.map(function (m) { var o = { id: m.id, name: m.name }; if (typeof m.color === "number") o.color = m.color; return o; });
      mesitas = next;
      return db.collection("config").doc("mesitas").set({ list: next });
    }).catch(function (e) { msg = errText(e, "No se pudo guardar el cambio."); render(); });
    return catQueue;
  }
  function mtag(id) {
    var info = mesitaInfo(id), t = mk("span", "mtag", info ? info.name : "Sin mesita");
    if (info) { t.style.setProperty("--accent", "var(--a" + info.k + ")"); t.style.setProperty("--tint", "var(--t" + info.k + ")"); }
    return t;
  }
  function styleRow(li, l) {
    var info = mesitaInfo(l.mesita);
    if (info) { li.style.setProperty("--accent", "var(--a" + info.k + ")"); li.style.setProperty("--tint", "var(--t" + info.k + ")"); li.style.borderLeft = "4px solid var(--a" + info.k + ")"; }
  }

  function compressImage(file, cb) {
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function () {
      URL.revokeObjectURL(url);
      var w = img.naturalWidth, h = img.naturalHeight, sc = Math.min(1, 1000 / Math.max(w, h));
      var c = document.createElement("canvas"); c.width = Math.max(1, Math.round(w * sc)); c.height = Math.max(1, Math.round(h * sc));
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      var q = 0.72, out = c.toDataURL("image/jpeg", q);
      while (out.length > 300000 && q > 0.3) { q -= 0.1; out = c.toDataURL("image/jpeg", q); }
      cb(out.length < 850000 ? out : null);
    };
    img.onerror = function () { URL.revokeObjectURL(url); cb(null); };
    img.src = url;
  }

  function recordView() {
    var card = mk("section", "card"); card.style.setProperty("--accent", "var(--a1)"); card.style.setProperty("--tint", "var(--t1)");
    var head = mk("div", "card-head"); head.appendChild(mk("h2", null, "Registro"));
    head.appendChild(mk("span", "count", loans.length + (loans.length >= 500 ? "+" : ""))); card.appendChild(head);

    var tools = mk("div", "add"); tools.style.flexWrap = "wrap";
    var q = draftInput("q", "", "Buscar persona o cosa…", 60); q.addEventListener("input", function () { render(); });
    tools.appendChild(q);
    var dl = mk("button", "btn", "⬇ CSV"); dl.type = "button"; dl.style.background = "var(--surface)"; dl.style.color = "var(--text)"; dl.addEventListener("click", downloadCsv);
    tools.appendChild(dl); card.appendChild(tools);

    var seg = mk("div", "chips"); seg.style.paddingTop = "12px";
    [["todos", "Todos"], ["pend", "Sin devolver"], ["dev", "Devueltos"]].forEach(function (o) {
      var c = mk("button", "chip" + (filter === o[0] ? " sel" : ""), o[1]); c.type = "button";
      c.addEventListener("click", function () { filter = o[0]; render(); }); seg.appendChild(c);
    });
    card.appendChild(seg);
    card.appendChild(mesitaChips());

    var term = clean(drafts.q).toLowerCase();
    var list = loans.filter(function (l) {
      if (filter === "pend" && l.returnedAt) return false;
      if (filter === "dev" && !l.returnedAt) return false;
      if (!mfilterFn(l)) return false;
      return !term || l.itemName.toLowerCase().indexOf(term) >= 0 || l.borrower.toLowerCase().indexOf(term) >= 0 || mesitaLabel(l.mesita).toLowerCase().indexOf(term) >= 0;
    });
    var ul = mk("ul");
    if (loansLoaded && !list.length) ul.appendChild(mk("li", "empty", loans.length ? "Nada coincide con la búsqueda." : "Todavía no hay préstamos registrados."));
    list.forEach(function (l) {
      var li = mk("li"); li.style.padding = "10px 16px"; styleRow(li, l);
      var tx = mk("span", "txt"); tx.style.padding = "0"; tx.appendChild(mtag(l.mesita));
      var strong = mk("b", null, l.itemName); tx.appendChild(strong); tx.appendChild(document.createTextNode(" → " + l.borrower + " "));
      tx.appendChild(mk("span", "tag " + (l.returnedAt ? "ok" : "pend"), l.returnedAt ? "Devuelto" : "Sin devolver"));
      tx.appendChild(mk("small", null, "Prestado: " + fmt(l.lentAt) + (l.lentBy ? " · anotó " + l.lentBy : "")));
      if (l.returnedAt) tx.appendChild(mk("small", null, "Devuelto: " + fmt(l.returnedAt) + (l.returnedBy ? " · recibió " + l.returnedBy : "")));
      if (l.note) tx.appendChild(mk("small", null, "📝 " + l.note));
      extraInfo(tx, l);
      li.appendChild(tx);
      if (canWrite()) li.appendChild(editBtn(l));
      if (!l.mesita && canWrite()) {
        var ms = mk("select"); ms.style.cssText = "flex:0 0 auto;width:140px;padding:6px 8px";
        var o0 = mk("option", null, "¿Qué mesita?"); o0.value = ""; ms.appendChild(o0);
        mesitas.forEach(function (m) { var o = mk("option", null, m.name); o.value = m.id; ms.appendChild(o); });
        ms.addEventListener("change", function () {
          if (ms.value) db.collection("loans").doc(l.id).update({ mesita: ms.value }).catch(function (e) { showToast(errText(e, "No se pudo asignar."), false); });
        });
        li.appendChild(ms);
      }
      if (canWrite() && l.returnedAt) {
        var re = mk("button", "btn", "Reabrir"); re.type = "button"; re.style.minHeight = "36px";
        re.addEventListener("click", function () { db.collection("loans").doc(l.id).update({ returnedAt: null, returnedBy: null }).catch(function (e) { showToast(errText(e, "No se pudo reabrir."), false); }); });
        li.appendChild(re);
      }
      if (isAdmin()) {
        var del = mk("button", "btn danger", pendingDel === l.id ? "¿Seguro?" : "✕"); del.type = "button"; del.style.minHeight = "36px";
        del.addEventListener("click", function () {
          if (pendingDel !== l.id) { pendingDel = l.id; render(); return; }
          pendingDel = null; db.collection("loanPhotos").doc(l.id).delete().catch(function () {}); db.collection("loans").doc(l.id).delete().catch(function (e) { showToast(errText(e, "No se pudo borrar."), false); });
        });
        li.appendChild(del);
      }
      ul.appendChild(li);
    });
    card.appendChild(ul); app.appendChild(card);
  }

  function membersView() {
    var card = mk("section", "card"); card.style.setProperty("--accent", "var(--a1)"); card.style.setProperty("--tint", "var(--t1)");
    var head = mk("div", "card-head"); head.appendChild(mk("h2", null, "Integrantes")); head.appendChild(mk("span", "count", String(users.length))); card.appendChild(head);
    var order = { pending: 0, blocked: 3, reader: 2, editor: 2, admin: 1 };
    var list = users.slice().sort(function (a, b) { return (order[a.role] - order[b.role]) || a.name.localeCompare(b.name); });
    list.forEach(function (u) {
      var row = mk("div", "member" + (u.role === "pending" ? " pend" : ""));
      var info = mk("div", "minfo"); info.appendChild(mk("b", null, u.name || u.email)); info.appendChild(mk("span", null, u.email)); row.appendChild(info);
      var sel = mk("select");
      ["pending", "reader", "editor", "admin", "blocked"].forEach(function (r) { var o = mk("option", null, ROLES[r]); o.value = r; if (r === u.role) o.selected = true; sel.appendChild(o); });
      if (u.uid === authUser.uid) sel.disabled = true;
      sel.addEventListener("change", function () { db.collection("users").doc(u.uid).update({ role: sel.value }).catch(function (e) { msg = errText(e, "No se pudo cambiar el rol."); render(); }); });
      row.appendChild(sel); card.appendChild(row);
    });
    if (!list.length) card.appendChild(mk("div", "empty", "Todavía no hay nadie."));
    app.appendChild(card);
    app.appendChild(mk("p", "note", "Los roles son los mismos que en la página de faltantes: se comparten entre las dos."));
  }

  init();
})();
</script>
</body>
</html>
